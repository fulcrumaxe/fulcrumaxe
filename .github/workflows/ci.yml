name: CI

# Lint, typecheck, build, and test the three JS/TS workspaces on every PR —
# internal and fork-originated. Deliberately triggered on the standard
# `pull_request` event only (the write-token-exposing variant of that event
# name is a footgun for fork PRs and must never be used here) so fork PRs
# get GitHub's default read-only, secret-free token. See D#1537.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.workspace }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [tui, dashboard, ts-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- npm workspaces (tui, dashboard) ---
      - name: Setup Node
        if: matrix.workspace != 'ts-backend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies (npm)
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm ci || (echo "npm ci failed, retrying once..." && sleep 5 && npm ci)

      - name: Lint
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Typecheck
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm run typecheck

      - name: Build
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm run build

      # D#1897: this used to override the committed vitest config via CLI
      # flags because the committed default (pool.forks.singleFork=true) was
      # believed to OOM on the full suite. That diagnosis was wrong — the
      # real OOM cause (single-fork V8 heap accumulating across ~40 jsdom
      # test files) is now fixed at the source in dashboard/vitest.config.ts,
      # which is bounded to maxForks:2 by default. CI now runs the exact same
      # `npm run test` a contributor runs locally — no flags, nothing to
      # drift out of sync.
      - name: Test
        if: matrix.workspace == 'dashboard'
        working-directory: dashboard
        run: npm run test

      # --- bun workspace (ts-backend) ---
      - name: Setup Bun
        if: matrix.workspace == 'ts-backend'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        if: matrix.workspace == 'ts-backend'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ts-backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (bun)
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun install || (echo "bun install failed, retrying once..." && sleep 5 && bun install)

      # ts-backend's parity test suite shells out to the real Python scripts
      # in backend/ (e.g. backend/agent_run_tracker.py, backend/orchestrator/
      # dispatch.py) to compare TS output against Python's actual behavior.
      # Those scripts import duckdb/anthropic — without this step the imports
      # fail, the (non-fatal, swallowed) errors produce empty/zero results,
      # and the parity assertions fail even though nothing is actually wrong
      # on either side. See D#1575.
      - name: Setup Python
        if: matrix.workspace == 'ts-backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: matrix.workspace == 'ts-backend'
        run: pip install -r requirements.txt

      - name: Typecheck
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run typecheck

      - name: Lint
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run lint

      - name: Build
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run build

      - name: Test
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run test

  export-audit:
    name: open-source export audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    # No secrets are used anywhere in this job. export.sh and
    # verify-export.sh themselves rsync into a local mktemp -d and never
    # touch the network -- but the claude CLI install step below does (a
    # public `npm install`, no credentials involved). This job is still
    # safe to run unconditionally on fork PRs: that property comes from the
    # absence of secrets, not from the absence of network traffic. See
    # D#1607, D#2212.
    #
    # Worst-case budget: plugin-install-gate.sh's own `timeout` wrappers sum
    # to 480s (8 min) if every step runs to its cap, plus the CLI install
    # and the other nine verify-export.sh checks. 5 minutes doesn't leave
    # room for that; 15 does. See PR #2212's body for the actual measured
    # duration on this repo's runner.
    timeout-minutes: 15
    env:
      # The one repository where open-source/ is expected to exist. This is a
      # second copy of a slug the resolvers own elsewhere
      # (scripts/lib/repo-resolve.sh, backend/_repo.py) -- deliberate,
      # because a workflow `if:` expression cannot call either of them. Named
      # once here rather than spelled out on each of the five step conditions
      # below, so there is one place to change and one place to grep.
      EXPORT_AUDIT_REPO: autonomous-agent-7/fulcrumaxe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # D#1989: one guard was being asked two different questions, and that
      # is why this job could not fail.
      #
      # D#1847 removed open-source/ from what this workflow ships, so on an
      # adopter's checked-out tree these scripts genuinely do not exist -- a
      # plain `run:` would be a permanently red check on their very first
      # push (exit 127, not a real failure). The old guard -- a bare
      # hashFiles() test on that path, with nothing else in the condition
      # -- skipped in that case, correctly. But it skipped identically when
      # the file was renamed or deleted HERE, where it must exist. A job
      # whose every step skips still reports success, so the audit went
      # green having audited nothing: on a real run before this change the
      # log was checkout, then cleanup, conclusion `success`.
      #
      # `github.repository` tells the two apart: absent-because-adopter
      # (skip, stay green) from absent-because-renamed (fail, and say which
      # path). hashFiles() still has to come after Checkout -- evaluated any
      # earlier the workspace is empty and every path reads as absent.
      #
      # For a `pull_request` event `github.repository` is the BASE
      # repository, not the fork's, so fork PRs opened against this repo keep
      # auditing.
      - name: Assert export tooling is present
        if: github.repository == env.EXPORT_AUDIT_REPO && hashFiles('open-source/verify-export.sh') == ''
        run: |
          echo "::error::open-source/verify-export.sh is missing from ${{ github.repository }}"
          {
            echo "open-source/verify-export.sh is missing from ${{ github.repository }}."
            echo "On this repository the export tooling must exist, so an absent file here means it was renamed or removed -- not that this is an adopter checkout."
            echo "Restore open-source/verify-export.sh, or update this job if the path moved."
          } >&2
          exit 1

      # D#2212: Node + the claude CLI are provisioned here under the same
      # condition as the audit itself, so an adopter's checked-out tree (no
      # open-source/) never pays for either -- installing a CLI they will
      # never use on every one of their pushes would be rude (D#1847).
      #
      # D#1989: that condition is now the repository, not hashFiles(). Past
      # the assert step above, on this repo the file provably exists, so a
      # hashFiles() guard here could only ever mask the rename it was
      # supposed to catch -- which is the defect, not a second layer of
      # defence against it.
      #
      # Node 22, not the "20" build-test uses above: @anthropic-ai/claude-
      # code's package.json declares engines.node >=22. A first pass at
      # this step used "20" and installed anyway (npm only warns,
      # EBADENGINE isn't fatal) -- but shipping a step that runs on an
      # engine it declares unsupported is exactly the kind of thing that
      # breaks silently on some future patch release. Checked against the
      # real run.
      - name: Setup Node
        if: github.repository == env.EXPORT_AUDIT_REPO
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned to an exact version, not a floating tag -- version drift
      # between claude builds is already real and already bit us: PR #2209
      # hardcoded a `-y` flag that only one of two builds on the
      # coordinator's host supported, and misreported the resulting
      # argument-parse failure as a manifest defect (it now feature-detects
      # instead, see detect_yes_flag() in
      # open-source/checks/plugin-install-gate.sh). 2.1.258 is one of the
      # two builds that script's own header documents as verified to honor
      # CLAUDE_CONFIG_DIR isolation end to end (the other is 2.1.187) --
      # chosen over npm's newest published build (2.1.259 as of this PR)
      # specifically so this step runs a build the gate has actually been
      # checked against, not whatever ships next.
      - name: Install claude CLI
        if: github.repository == env.EXPORT_AUDIT_REPO
        run: npm install -g @anthropic-ai/claude-code@2.1.258

      - name: Run verify-export.sh
        if: github.repository == env.EXPORT_AUDIT_REPO
        env:
          # Step-level only -- deliberately not job- or workflow-level. This
          # turns a SKIP into a hard FAIL (D#2210 round 4's opt-in default),
          # and broadening its scope would leak into contexts where a
          # script invoking the real CLI from inside itself is the D#439
          # recursion gap that default exists to close. See
          # open-source/verify-export.sh:496-588.
          REQUIRE_PLUGIN_INSTALL_GATE: 1
        run: bash open-source/verify-export.sh

      # D#1890: loop-bootstrap/'s payload is now derived from BOOTSTRAP_PATHS
      # rather than hand-maintained — these two checks are what keep that
      # true instead of merely asserted. Same fork-safety reasoning as
      # verify-export.sh above: guarded on the repository rather than on the
      # checked-out tree, because open-source/ and loop-bootstrap/ are both
      # excluded from what this workflow itself ships to adopters, and a
      # rename of either script on THIS repo has to be loud (D#1989).
      - name: BOOTSTRAP_PATHS subset check
        if: github.repository == env.EXPORT_AUDIT_REPO
        run: python3 open-source/checks/bootstrap_subset.py

      - name: Bootstrap file classification coverage check
        if: github.repository == env.EXPORT_AUDIT_REPO
        run: python3 open-source/checks/verify_classification.py

  # Import-smoke gate for backend/ itself (D#1608). Deliberately NOT the full
  # backend/tests suite — this job only confirms Python modules import
  # without throwing; it does not run the tests and cannot tell you whether
  # they pass. D#1900 tracks adding a real pytest gate. Until then this job
  # catches the cheap, common case: a fork PR that breaks a Python import.
  backend:
    name: backend (import-smoke)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Import-smoke (backend/*.py)
        run: python3 scripts/ci/backend-import-smoke.py

      # D#2339 PR-b: one step, every behavioral guard. Until this, each guard
      # was its own step at this same insertion point — nineteen of them — and
      # five guard-adding PRs in roughly one hour produced three mechanical
      # conflicts on these exact lines. The conflict itself was cheap;
      # resolving it was not. Two steps competing for one insertion point
      # means taking one side drops the other, and nothing fails when it
      # does: the job still runs, the PR still merges, and that guard is gone
      # with no signal anywhere.
      #
      # scripts/ci/run-guards.sh discovers every file in scripts/ci/ that is
      # not ledgered in scripts/ci/guard-ledger.json, runs it, and prints one
      # PASS/FAIL line per guard with every failing filename on its last
      # line. Adding a guard is adding a file to that directory and editing
      # no YAML, so there is no shared insertion point left to conflict on.
      # Each guard's rationale lives in its own module docstring, which is
      # where a reader of that guard looks; it is no longer duplicated here.
      #
      # The runner runs every guard even after one fails, so a PR that breaks
      # two learns about both in one round. It fails when it discovers
      # nothing and when it meets a file it cannot dispatch — a runner that
      # quietly runs no guards is the silent skip this replaces, not an
      # improvement on it.
      #
      # Same naming caveat as every step in this job: the job's name is
      # string-matched by CI_REQUIRED_CHECKS in scripts/lib/ci-status-check.sh
      # — add steps here freely, do not rename the job.
      - name: Behavioral guards (scripts/ci/)
        run: bash scripts/ci/run-guards.sh

      # D#2339: reconciles scripts/ci/ against what actually runs it. PR-a
      # added this against the per-guard steps; PR-b repointed it at the
      # runner above. Every file in this directory must be in the runner's
      # discovered set, or ledgered in scripts/ci/guard-ledger.json with a
      # checkable reason — 'own_step' for a file a workflow invokes directly
      # (which this check then verifies is really referenced), 'exempt' for a
      # file nothing runs (which it verifies is really referenced by
      # nothing). Anything else fails the build, naming the file. It found
      # one already present on main when PR-a landed: clean-install-check.sh,
      # unreferenced since D#1617 and now ledgered.
      #
      # The runner removed the per-step insertion point but not the failure
      # mode — it concentrated it. There is no per-guard step left to drop,
      # and instead one step whose loss would take all nineteen guards down
      # at once. So this check also requires run-guards.sh itself to be
      # referenced by a workflow.
      #
      # `!cancelled()` on purpose: without it a red runner above would stop
      # the job before this step ran, and a dropped guard would stay hidden
      # behind an unrelated failure for that whole CI round. This step's own
      # failure still fails the job. That is also why it is its own step
      # rather than a guard inside the runner — a guard cannot report on a
      # runner that failed to start.
      #
      # Same naming caveat as every step in this job: the job's name is
      # string-matched by CI_REQUIRED_CHECKS in scripts/lib/ci-status-check.sh
      # — add steps here freely, do not rename the job.
      - name: Guard registry reconciliation
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/guard-registry-check.py

      # D#2332: tests/test_merge_and_hook.sh drives the real
      # scripts/merge-and-hook.sh against stubbed gh/post-merge-hook, and it is
      # where the manual merge path's gates — Two-Gate, HG-7, CI-status, and
      # now browser-test — are held in place. Until this step, no CI job ran
      # it: only scripts/run-pr-tests.sh routed to it, which is loop-side, not
      # CI, so deleting a gate from that script failed nothing. That is the
      # same "a check that gates nothing" shape D#2332 is about, so the gate it
      # adds gets a runner rather than the same silence one layer down.
      #
      # A separate step rather than a file in scripts/ci/, deliberately: the
      # runner above discovers that directory, and guard-registry-check.py
      # fails a file that is both runner-discovered and separately invoked.
      # This is a tests/ suite, so it is in neither set and needs no ledger
      # entry. It is also not a static scan of source text — it executes the
      # script under review — which is the other reason it does not belong
      # among the behavioral guards.
      #
      # Fails the build the ordinary way: a non-zero exit fails this step,
      # which fails this job, whose name is one of the four exact strings in
      # CI_REQUIRED_CHECKS (scripts/lib/ci-status-check.sh), so a red run
      # blocks the merge gate on both merge paths. Hermetic: no network, no
      # GH_TOKEN, no dependency beyond bash + python3, everything written
      # under mktemp.
      - name: Manual-merge gate suite (merge-and-hook)
        if: ${{ !cancelled() }}
        run: bash tests/test_merge_and_hook.sh

      # D#1987: tests/test_ci_status_check.sh drives the real
      # scripts/lib/ci-status-check.sh — the CI-status merge gate itself —
      # through its own CI_STATUS_OVERRIDE_<pr> / CI_KILL_SWITCH_OVERRIDE mock
      # seams. Until this step, no CI job invoked it: the only tests/ path
      # referenced anywhere in this file was test_merge_and_hook.sh above, so a
      # change to the gate that decides what reaches main failed nothing. That
      # is the same "a check that gates nothing" shape as the step above, and
      # it gets the same answer rather than the same silence one layer down.
      #
      # A separate step rather than a file in scripts/ci/, for the two reasons
      # written out above: run-guards.sh discovers that directory and
      # guard-registry-check.py fails a file that is both discovered and
      # separately invoked, and this is a tests/ suite that EXECUTES the script
      # under review rather than statically scanning its source. So it is in
      # neither the discovered set nor guard-ledger.json and needs no ledger
      # entry.
      #
      # Fails the build the ordinary way: a non-zero exit fails this step,
      # which fails this job, whose name — "backend (import-smoke)" — is one of
      # the five exact strings in CI_REQUIRED_CHECKS
      # (scripts/lib/ci-status-check.sh), so a red run blocks the merge gate on
      # both merge paths. Hermetic: CI_STATUS_TEST_MODE=1 routes every fetch
      # through the mock seams, so no network, no GH_TOKEN, and zero GitHub API
      # calls.
      - name: CI-status merge gate suite (ci-status-check)
        if: ${{ !cancelled() }}
        run: bash tests/test_ci_status_check.sh

      # No ruff/flake8 config exists in the repo today (checked
      # pyproject.toml / setup.cfg) — Python lint is intentionally omitted
      # rather than adding new lint config as part of this Spec.

  # Runs the always-on preflight gates in CI itself (D#2271/D#2289 PR-b).
  # Before this job existed, no CI job invoked preflight at all — an
  # executor's local `preflight-fast.sh` run was the only place these gates
  # ever ran, so a fork PR (or an executor who skipped preflight) merged
  # with zero verification from this class of check.
  #
  # Deliberately NOT `bash scripts/preflight-fast.sh` — that also runs
  # diff-aware pytest, which would drag this job into `backend/tests`'
  # known-red state (see the `backend` job's comment above, D#1477) on any
  # PR whose diff touches backend/. This job calls run_always_gates()
  # directly: the same 7 gates (measured 1.34s on a Linux dev host,
  # scope: those gates alone, no pytest/lint) that both preflight-fast.sh
  # and preflight-full.sh already share.
  #
  # This job intentionally does not assert WHICH gates ran or how many —
  # run_always_gates() itself does that (self_skip()/SELF_SKIPPED_COUNT in
  # scripts/lib/preflight-common.sh) and hard-fails before returning if any
  # gate self-skipped instead of producing a verdict. Nothing here
  # duplicates or lists gate names; that is the point (AC-9).
  preflight:
    name: preflight (always-on gates)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout@v4's default fetch-depth is 1: it fetches only the
      # tip of whatever ref triggered this run, and does NOT fetch `main`
      # at all. get_changed_files() (scripts/lib/preflight-common.sh) diffs
      # against `origin/main` — under the default depth, that ref simply
      # does not exist in this checkout, and neither does `HEAD~1` (only
      # one commit was fetched). Both used to silently resolve to "no files
      # changed" (a trailing `|| true`); that's fixed at the function level
      # now (AC-11), but the fix only matters if `origin/main` is at least
      # reachable, so this step fetches it explicitly. A shallow, single-
      # commit fetch is enough — `git diff` only needs the commit's tree,
      # not its history — so this does not need `fetch-depth: 0` on the
      # Checkout step above.
      - name: Fetch main (diff base for preflight gates)
        run: git fetch --no-tags --depth=1 origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run always-on preflight gates
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE"
          source "$REPO_ROOT/scripts/lib/preflight-common.sh"
          START_TS=$SECONDS
          CHECKS_RUN=0
          CURRENT_SLUG=""
          FAILED=0
          echo "=== Preflight gates (CI) ==="
          echo ""
          run_always_gates
          echo ""
          echo "=== All gates verified ==="
          echo "PRESUM: pass checks=${CHECKS_RUN} self_skipped=${SELF_SKIPPED_COUNT} duration=$((SECONDS-START_TS))s"
