name: CI

# Lint, typecheck, build, and test the three JS/TS workspaces on every PR —
# internal and fork-originated. Deliberately triggered on the standard
# `pull_request` event only (the write-token-exposing variant of that event
# name is a footgun for fork PRs and must never be used here) so fork PRs
# get GitHub's default read-only, secret-free token. See D#1537.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.workspace }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [tui, dashboard, ts-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- npm workspaces (tui, dashboard) ---
      - name: Setup Node
        if: matrix.workspace != 'ts-backend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies (npm)
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm ci || (echo "npm ci failed, retrying once..." && sleep 5 && npm ci)

      - name: Lint
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Typecheck
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm run typecheck

      - name: Build
        if: matrix.workspace != 'ts-backend'
        working-directory: ${{ matrix.workspace }}
        run: npm run build

      # D#1897: this used to override the committed vitest config via CLI
      # flags because the committed default (pool.forks.singleFork=true) was
      # believed to OOM on the full suite. That diagnosis was wrong — the
      # real OOM cause (single-fork V8 heap accumulating across ~40 jsdom
      # test files) is now fixed at the source in dashboard/vitest.config.ts,
      # which is bounded to maxForks:2 by default. CI now runs the exact same
      # `npm run test` a contributor runs locally — no flags, nothing to
      # drift out of sync.
      - name: Test
        if: matrix.workspace == 'dashboard'
        working-directory: dashboard
        run: npm run test

      # --- bun workspace (ts-backend) ---
      - name: Setup Bun
        if: matrix.workspace == 'ts-backend'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        if: matrix.workspace == 'ts-backend'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ts-backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (bun)
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun install || (echo "bun install failed, retrying once..." && sleep 5 && bun install)

      # ts-backend's parity test suite shells out to the real Python scripts
      # in backend/ (e.g. backend/agent_run_tracker.py, backend/orchestrator/
      # dispatch.py) to compare TS output against Python's actual behavior.
      # Those scripts import duckdb/anthropic — without this step the imports
      # fail, the (non-fatal, swallowed) errors produce empty/zero results,
      # and the parity assertions fail even though nothing is actually wrong
      # on either side. See D#1575.
      - name: Setup Python
        if: matrix.workspace == 'ts-backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: matrix.workspace == 'ts-backend'
        run: pip install -r requirements.txt

      - name: Typecheck
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run typecheck

      - name: Lint
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run lint

      - name: Build
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run build

      - name: Test
        if: matrix.workspace == 'ts-backend'
        working-directory: ts-backend
        run: bun run test

  export-audit:
    name: open-source export audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    # No secrets are used anywhere in this job. export.sh and
    # verify-export.sh themselves rsync into a local mktemp -d and never
    # touch the network -- but the claude CLI install step below does (a
    # public `npm install`, no credentials involved). This job is still
    # safe to run unconditionally on fork PRs: that property comes from the
    # absence of secrets, not from the absence of network traffic. See
    # D#1607, D#2212.
    #
    # Worst-case budget: plugin-install-gate.sh's own `timeout` wrappers sum
    # to 480s (8 min) if every step runs to its cap, plus the CLI install
    # and the other nine verify-export.sh checks. 5 minutes doesn't leave
    # room for that; 15 does. See PR #2212's body for the actual measured
    # duration on this repo's runner.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # D#1847 removed open-source/ from what this workflow itself ships in
      # an export, so on an adopter's checked-out tree this script no longer
      # exists — a plain `run:` here would be a permanently red check on
      # every adopter's first push (exit 127, not a real failure). Guard on
      # the checked-out tree rather than dropping the job outright, so it
      # still runs unconditionally on this repo, where open-source/ does
      # exist. hashFiles() has to come after Checkout — evaluated any
      # earlier the workspace is empty and this would always read as absent.
      #
      # D#2212: Node + the claude CLI are provisioned here, guarded by the
      # same hashFiles() check, so an adopter's checked-out tree (no
      # open-source/) never pays for either -- installing a CLI they will
      # never use on every one of their pushes would be rude (D#1847).
      #
      # Node 22, not the "20" build-test uses above: @anthropic-ai/claude-
      # code's package.json declares engines.node >=22. A first pass at
      # this step used "20" and installed anyway (npm only warns,
      # EBADENGINE isn't fatal) -- but shipping a step that runs on an
      # engine it declares unsupported is exactly the kind of thing that
      # breaks silently on some future patch release. Checked against the
      # real run.
      - name: Setup Node
        if: hashFiles('open-source/verify-export.sh') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned to an exact version, not a floating tag -- version drift
      # between claude builds is already real and already bit us: PR #2209
      # hardcoded a `-y` flag that only one of two builds on the
      # coordinator's host supported, and misreported the resulting
      # argument-parse failure as a manifest defect (it now feature-detects
      # instead, see detect_yes_flag() in
      # open-source/checks/plugin-install-gate.sh). 2.1.258 is one of the
      # two builds that script's own header documents as verified to honor
      # CLAUDE_CONFIG_DIR isolation end to end (the other is 2.1.187) --
      # chosen over npm's newest published build (2.1.259 as of this PR)
      # specifically so this step runs a build the gate has actually been
      # checked against, not whatever ships next.
      - name: Install claude CLI
        if: hashFiles('open-source/verify-export.sh') != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.258

      - name: Run verify-export.sh
        if: hashFiles('open-source/verify-export.sh') != ''
        env:
          # Step-level only -- deliberately not job- or workflow-level. This
          # turns a SKIP into a hard FAIL (D#2210 round 4's opt-in default),
          # and broadening its scope would leak into contexts where a
          # script invoking the real CLI from inside itself is the D#439
          # recursion gap that default exists to close. See
          # open-source/verify-export.sh:496-588.
          REQUIRE_PLUGIN_INSTALL_GATE: 1
        run: bash open-source/verify-export.sh

      # D#1890: loop-bootstrap/'s payload is now derived from BOOTSTRAP_PATHS
      # rather than hand-maintained — these two checks are what keep that
      # true instead of merely asserted. Same fork-safety reasoning as
      # verify-export.sh above: guarded on the checked-out tree because
      # open-source/ and loop-bootstrap/ are both excluded from what this
      # workflow itself ships to adopters.
      - name: BOOTSTRAP_PATHS subset check
        if: hashFiles('open-source/checks/bootstrap_subset.py') != ''
        run: python3 open-source/checks/bootstrap_subset.py

      - name: Bootstrap file classification coverage check
        if: hashFiles('open-source/checks/verify_classification.py') != ''
        run: python3 open-source/checks/verify_classification.py

  # Import-smoke gate for backend/ itself (D#1608). Deliberately NOT the full
  # backend/tests suite — that suite is known red on main (D#1477 umbrella,
  # ~151 failures from the unreconciled D#1411 FastAPI migration) and would
  # make this job permanently red. Once D#1477 restores backend test health,
  # a follow-on Spec can add a real pytest gate here. Until then this job
  # catches the cheap, common case: a fork PR that breaks a Python import.
  backend:
    name: backend (import-smoke)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Import-smoke (backend/*.py)
        run: python3 scripts/ci/backend-import-smoke.py

      # D#2253: replaces the old per-role whole-prompt growth bound in
      # backend/tests/test_working_principles_background.py, which measured
      # the entire rendered role prompt (not just the working-principles
      # block) against a frozen 2026-08 baseline, was red on all three
      # measured roles, and was never actually reached by CI or by
      # scripts/run-pr-tests.sh's routing. This step runs on every PR
      # (including forks) in a job that is already green, needs only
      # stdlib + bash (no new dependency), and measures only the block its
      # name claims to guard.
      - name: Working-principles block size
        run: python3 scripts/ci/working-principles-size.py

      # D#2309: behavioral guard against project-blind caches sitting
      # underneath scoped RPC dispatch — four confirmed instances of this
      # bug shape landed before this, none of them caught by a test. Not a
      # lint over source text: it calls dispatch_scoped() against two
      # fixture projects and asserts warming one project's caches never
      # answers the other project's request. No network/GH_TOKEN/new
      # dependency — stdlib + duckdb (already in requirements.txt).
      #
      # NOTE — this job's *name* ("backend (import-smoke)") is
      # string-matched by scripts/lib/ci-status-check.sh:42's
      # CI_REQUIRED_CHECKS array. Renaming the job without updating that
      # array makes the required check disappear, which fails closed and
      # blocks every merge — see that file's D#1608/#1610 comment. Add a
      # step here freely; do not rename the job.
      - name: RPC scope cache guard
        run: python3 scripts/ci/rpc-scope-cache-guard.py

      # D#2327 PR-a: the scope registry must not contradict itself. On main
      # at dc5868b2, stats.loop_idle_ratio was classified SCOPED next to a
      # justification saying it was NOT wrapped and was bound to the serving
      # checkout — the field a machine reads was the false one, and nothing
      # noticed for six days. Nineteen entries also shared one "already
      # wrapped in _with_project_stats_db()" claim nobody had checked
      # against what those handlers read. This asserts the classification,
      # the justification text, and the audited per-method data source stay
      # consistent, with a live canary so it cannot go inert. Static by
      # design — the behavioral question is the cache guard's above and
      # D#2327 PR-b's. Same job-naming note as the guards around it: this
      # step lives in "backend (import-smoke)" because that name is what
      # scripts/lib/ci-status-check.sh's CI_REQUIRED_CHECKS matches. Do not
      # rename the job.
      - name: RPC scope registry consistency guard
        run: python3 scripts/ci/rpc-scope-registry-guard.py

      # D#2314: behavioral guard for the Projects-page liveness signal. The
      # probe used to read three cron signals that were never written on the
      # operator's host — it read `idle` through the team's highest-volume
      # day on record (43 PRs merged). Replaces them with fleet.db rows.
      # Not a lint over source text: registers a real child process into a
      # throwaway fleet.db, asserts `active`, kills it, asserts `idle` on
      # the same row with no other change — plus cross-project isolation
      # and the unresolvable-name / failed-read -> `unknown` paths. Same
      # naming caveat as the step above: this job's name is string-matched
      # by CI_REQUIRED_CHECKS — add steps here freely, do not rename the job.
      - name: Project liveness signal guard
        run: python3 scripts/ci/project-liveness-guard.py

      # D#2310: regression guard for queue counts that ignore `closed_at`.
      # backend/cli.py and scripts/loop-preflight.sh each used to re-derive
      # queue-state counts (SPEC_READY, DISCUSSING, ...) from every registry
      # row with no open/closed filter, overstating the live queue by close
      # to an order of magnitude ("304 DISCUSSING" was really 17 open).
      # Behavioral, not a lint: it builds a fixture registry via
      # DiscussionRegistry(state_dir=<tmpdir>) with closed rows in every
      # status bucket, checks DiscussionRegistry.queue_summary() (the one
      # shared open-filter implementation both fixed call sites now read
      # from) against open-only counts derived from the fixture's own
      # construction, then defeats the filter and confirms the fixture can
      # tell the difference. No network, no GH_TOKEN, no new dependency.
      #
      # Same job-naming note as the RPC scope cache guard above applies here
      # — this step lives in "backend (import-smoke)" because that name is
      # what scripts/lib/ci-status-check.sh's CI_REQUIRED_CHECKS matches.
      - name: Registry queue-count filter guard
        run: python3 scripts/ci/registry-queue-count-guard.py

      # D#2316 PR-b: behavioral guard for run attribution on Agent()-spawned
      # runs. start_run() has exactly one caller (scripts/spawn-agent.sh);
      # runs spawned via the Agent() tool never call it, so complete_run()
      # used to fall into its INSERT branch and unconditionally stamp
      # role='orphan-unmatched' with start_ts=end_ts (duration_s=0) — 77-92
      # of ~120 same-day rows on the operator host. Not a lint over source
      # text: it builds a fixture agent_run DB in a tmpdir (STATS_DB_PATH)
      # and drives the real start_run()/complete_run() against synthetic
      # completions the file constructs itself, asserting the no-guessing
      # (D#2282) and no-clobber invariants plus honest NULL-vs-0 duration.
      # No network, no GH_TOKEN, no new dependency. Same job-naming note as
      # the guards above — this step lives in "backend (import-smoke)"
      # because that name is what scripts/lib/ci-status-check.sh's
      # CI_REQUIRED_CHECKS matches. Do not rename the job.
      - name: Agent-run attribution guard
        run: python3 scripts/ci/agent-run-attribution-guard.py

      # D#2315: behavioral guard for the loop-metrics int-timestamp crash.
      # backend/stats_writer.py:loop_idle_ratio_24h used to raise
      # AttributeError on a row whose timestamp is a raw epoch int rather
      # than an ISO string, surfacing as JSON-RPC -32000 to the Stats-page
      # tile (fixed separately on the dashboard side — see the `dashboard`
      # matrix leg). server.py's loop.timeline and health_monitor.py each
      # mishandled the same row a different way. All three now share one
      # parser (backend/loop_metrics_ts.py) with skip-not-recover semantics.
      # Not a lint over source text: builds a fixture loop-metrics.jsonl,
      # calls the three real functions, and defeats the shared parser to
      # confirm the fixture can tell a fixed implementation from the
      # original crash. Same job-naming note as the guards above applies —
      # this step lives here because that's what CI_REQUIRED_CHECKS matches.
      - name: Loop-metrics timestamp guard
        run: python3 scripts/ci/loop-idle-ratio-timestamp-guard.py

      # D#2317 PR-a: behavioral guard for the Fleet page's resolved project
      # set and measured status. Before this, two disjoint fleet-discovery
      # mechanisms disagreed about which projects existed (the serving
      # project itself was invisible to the Fleet Projects table), and
      # every visible row read a boolean `ok` that only ever meant
      # "project.json parsed" — all 7 surviving projects on the operator's
      # host read `ok` with nothing listening on any advertised port. Not a
      # lint over source text: it builds a fixture HOME, binds real
      # listening sockets, and calls the real resolve_fleet_set(), then
      # asserts the resolved-set union, dedup, and each of the four
      # measured status values a project can actually earn. Same naming
      # caveat as the steps above: this job's name is string-matched by
      # CI_REQUIRED_CHECKS — add steps here freely, do not rename the job.
      - name: Fleet status honesty guard
        run: python3 scripts/ci/fleet-status-honesty-guard.py

      # D#2317 PR-b: behavioral guard for the Fleet Token Spend panel. It
      # read "LAST 24H = 0" against "LAST 7D = 1.2M" on the busiest day the
      # team had ever had, because fleet.cost iterated the project.json
      # discovery path and so never opened the one cost_summary.json that
      # is actually written, the writer pruned by entry count rather than
      # date (a "7d" total covering 19 days), and a project with no
      # observation reported a 0 indistinguishable from a measured zero.
      # Not a lint over source text: it seeds fixture state dirs with a
      # 60-day-sparse summary and calls the real read_cost_summary /
      # update_cost_summary / fleet_cost.handle. Same naming caveat as the
      # guards above: this job's name is string-matched by
      # CI_REQUIRED_CHECKS — add steps here freely, do not rename the job.
      - name: Fleet cost window guard
        run: python3 scripts/ci/fleet-cost-window-guard.py

      # D#2335 PR 1: behavioral guard for scripts/update-check.sh, the
      # detection half of /update. Builds scratch trees in a tmpdir and
      # drives the real script with UPDATE_CHECK_UPSTREAM_CMD injected for
      # every scenario, asserting exit code and message for all four
      # verdicts (up to date / update available / cannot determine x2) plus
      # --record-baseline and usage-error handling. No network, no
      # GH_TOKEN, no new dependency. Same naming caveat as the guards
      # above: this job's name is string-matched by CI_REQUIRED_CHECKS —
      # add steps here freely, do not rename the job.
      - name: update-check guard
        run: python3 scripts/ci/update-check-guard.py

      # D#2317 PR-c: a test may not coldstart into the operator's home
      # directory. Both coldstart entry points hardcoded $HOME/.<name>-state
      # with no override, and tests/test_loop_metrics_path.sh coldstarted
      # `test-proj-$$` on every run while "cleaning up"
      # /tmp/${PROJECT_NAME}-state — wrong root, missing leading dot — so it
      # never removed what it created. That one line produced 44 of the 75
      # dead fixtures the Fleet page was listing as live projects, at one
      # directory per run. This guard fails when a file under tests/ runs a
      # coldstart script without redirecting COLDSTART_STATE_ROOT, and runs
      # its own positive/negative self-test first so it cannot rot into a
      # check that never fails. Stdlib only, no network, no GH_TOKEN. Same
      # naming caveat as the guards above: this job's name is string-matched
      # by CI_REQUIRED_CHECKS — add steps here freely, do not rename the job.
      - name: Coldstart state-dir containment guard
        run: python3 scripts/ci/coldstart-state-dir-guard.py
      # D#2316 PR-c: behavioral guard for two stats readers that each reported
      # a confident value they never measured. sdk_vs_cc's pass rate averaged
      # CASE-over-COUNT(*), so a population where nothing ever recorded a
      # verdict (every routed_via='cc' row — 5526 rows, 0 verdicts, dead since
      # 2026-08-19) read as a flat 0.0% across all 22 roles. The freshness
      # watchdog branched on hasattr(ts, "astimezone"), which every datetime
      # has, so naive UTC timestamps got reinterpreted as local and 16 of 17
      # metrics came back with NEGATIVE ages on the operator host. Not a lint
      # over source text: builds a fixture stats.duckdb in a tmpdir
      # (STATS_DB_PATH), writes metric_event rows through the real
      # stats_writer.record(), and calls the real sdk_vs_cc_by_role() and
      # freshness check() against it under TZ=America/New_York — a UTC runner
      # cannot see the timezone defect at all. Every expectation derives from
      # the fixture's own construction; no literal population counts. Same
      # job-naming note as the guards above — this step lives in
      # "backend (import-smoke)" because that name is what
      # scripts/lib/ci-status-check.sh's CI_REQUIRED_CHECKS matches. Do not
      # rename the job.
      - name: Stats reader honesty guard
        run: python3 scripts/ci/stats-reader-honesty-guard.py

      # D#2348 PR-i: three checks that until now only ever ran against a
      # PRODUCED EXPORT TREE, from open-source/verify-export.sh. That is the
      # wrong subject once development happens in the public repo — the
      # repository itself becomes the artifact, and a gate scoped to what
      # the export shipped cannot audit what the export did not. D#2348
      # found that hole three separate times (307 stale slugs in tests/, 10
      # in dashboard_tui/, 115 product-identifier hits across backend/,
      # dashboard/ and scripts/), each one structurally invisible to a check
      # pointed at export output.
      #
      # These are ports, not moves. open-source/verify-export.sh still runs
      # the originals against a real export in the export-audit job above,
      # and it must keep working until D#2348's archive phase retires the
      # export — that Discussion names an export-audit that survives as a
      # permanently-skipping green stub as an explicit failure condition.
      #
      # Bash, not Python, and no new dependency: git + grep only. Same
      # naming caveat as every guard above — this job's name is
      # string-matched by CI_REQUIRED_CHECKS in
      # scripts/lib/ci-status-check.sh. Add steps here freely, do not
      # rename the job.
      - name: Repo-target default guard (source tree)
        run: bash scripts/ci/repo-target-gate.sh

      - name: README link resolution
        run: bash scripts/ci/readme-links.sh

      - name: Dangling doc commands
        run: bash scripts/ci/dangling-doc-commands.sh

      # The repo-plane cutover gate. Runs here, in this unconditional job,
      # because everywhere else it would have been unreachable on the one
      # change it exists to stop: ci.yml's backend job runs targeted
      # scripts/ci/* guards rather than pytest, preflight runs
      # run_always_gates, and run-pr-tests.sh routes a config-only PR to no
      # suite at all — and setting "code_repo" is a config-only PR.
      #
      # Same naming caveat as every guard above: this job's name is
      # string-matched by CI_REQUIRED_CHECKS in scripts/lib/ci-status-check.sh
      # — add steps here freely, do not rename the job.
      - name: Repo-plane cutover guard
        run: python3 scripts/ci/repo-plane-cutover-guard.py

      # D#2339 PR-a: reconciles scripts/ci/ against this workflow. Every one
      # of the guards above is a step at the same insertion point in this
      # one job, so resolving a merge conflict here by taking one side drops
      # the other — and nothing fails. The job still runs, the PR still
      # merges, and that guard is gone with no signal. This step is the
      # signal: a file in scripts/ci/ that is neither run here nor listed in
      # scripts/ci/guard-ledger.json with a reason fails the build, naming
      # the file. It found one already present on main
      # (clean-install-check.sh, unreferenced since D#1617 — now ledgered).
      #
      # `!cancelled()` on purpose: without it a red guard above would stop
      # the job before this step ran, and a dropped guard would stay hidden
      # behind an unrelated failure for that whole CI round. This step's own
      # failure still fails the job.
      #
      # Same naming caveat as every guard above: this job's name is
      # string-matched by CI_REQUIRED_CHECKS in scripts/lib/ci-status-check.sh
      # — add steps here freely, do not rename the job.
      - name: Guard registry reconciliation
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/guard-registry-check.py

      # D#2335 PR 2: behavioral guard for scripts/update-apply.sh, the
      # application half of /update. Builds a scratch adopter project and a
      # fixture engine tree in a tmpdir and drives the real script against
      # them: the first apply must write nothing but a preview marker, the
      # second must actually install, a third must report already-up-to-date
      # and write nothing, and local .autonomous-team/*.json plus
      # $AUTONOMOUS_TEAM_STATE_DIR must come out byte-identical. Also
      # asserts mechanically that an update removes nothing (no --delete on
      # any rsync in bootstrap.sh, no `git rm` anywhere), which is what
      # makes the Archive Protocol a no-op here rather than a claim. A
      # fixture engine rather than the real loop-bootstrap/ because a real
      # bootstrap shells out to `gh` — no network, no GH_TOKEN, no new
      # dependency. Same naming caveat as the guards above: this job's name
      # is string-matched by CI_REQUIRED_CHECKS — add steps here freely, do
      # not rename the job.
      - name: update-apply guard
        run: python3 scripts/ci/update-apply-guard.py

      # No ruff/flake8 config exists in the repo today (checked
      # pyproject.toml / setup.cfg) — Python lint is intentionally omitted
      # rather than adding new lint config as part of this Spec.

  # Runs the always-on preflight gates in CI itself (D#2271/D#2289 PR-b).
  # Before this job existed, no CI job invoked preflight at all — an
  # executor's local `preflight-fast.sh` run was the only place these gates
  # ever ran, so a fork PR (or an executor who skipped preflight) merged
  # with zero verification from this class of check.
  #
  # Deliberately NOT `bash scripts/preflight-fast.sh` — that also runs
  # diff-aware pytest, which would drag this job into `backend/tests`'
  # known-red state (see the `backend` job's comment above, D#1477) on any
  # PR whose diff touches backend/. This job calls run_always_gates()
  # directly: the same 7 gates (measured 1.34s on a Linux dev host,
  # scope: those gates alone, no pytest/lint) that both preflight-fast.sh
  # and preflight-full.sh already share.
  #
  # This job intentionally does not assert WHICH gates ran or how many —
  # run_always_gates() itself does that (self_skip()/SELF_SKIPPED_COUNT in
  # scripts/lib/preflight-common.sh) and hard-fails before returning if any
  # gate self-skipped instead of producing a verdict. Nothing here
  # duplicates or lists gate names; that is the point (AC-9).
  preflight:
    name: preflight (always-on gates)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Kill switch: set repo variable CI_DISABLED=true to skip this job and
    # consume zero billable minutes. A job-level `if:` is evaluated BEFORE
    # matrix expansion, so a skipped matrix job does NOT produce one
    # check-run per leg — GitHub registers a single placeholder named for the
    # unexpanded `${{ matrix.workspace }}` expression, and the per-leg names
    # (tui, dashboard, ts-backend) never appear at all. The merge gate does
    # not rely on those check-runs while the switch is on: it reads this same
    # variable and stands down explicitly, writing a ci_gate_stood_down audit
    # row (see scripts/lib/ci-status-check.sh, D#1944). Change the variable
    # with scripts/set-ci-kill-switch.sh so the change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout@v4's default fetch-depth is 1: it fetches only the
      # tip of whatever ref triggered this run, and does NOT fetch `main`
      # at all. get_changed_files() (scripts/lib/preflight-common.sh) diffs
      # against `origin/main` — under the default depth, that ref simply
      # does not exist in this checkout, and neither does `HEAD~1` (only
      # one commit was fetched). Both used to silently resolve to "no files
      # changed" (a trailing `|| true`); that's fixed at the function level
      # now (AC-11), but the fix only matters if `origin/main` is at least
      # reachable, so this step fetches it explicitly. A shallow, single-
      # commit fetch is enough — `git diff` only needs the commit's tree,
      # not its history — so this does not need `fetch-depth: 0` on the
      # Checkout step above.
      - name: Fetch main (diff base for preflight gates)
        run: git fetch --no-tags --depth=1 origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run always-on preflight gates
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE"
          source "$REPO_ROOT/scripts/lib/preflight-common.sh"
          START_TS=$SECONDS
          CHECKS_RUN=0
          CURRENT_SLUG=""
          FAILED=0
          echo "=== Preflight gates (CI) ==="
          echo ""
          run_always_gates
          echo ""
          echo "=== All gates verified ==="
          echo "PRESUM: pass checks=${CHECKS_RUN} self_skipped=${SELF_SKIPPED_COUNT} duration=$((SECONDS-START_TS))s"
