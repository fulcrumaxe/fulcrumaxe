name: PR gates

# Gates for the move to a public development repo (D#2348 PR-h) plus a third
# added later (pr-mutation-evidence, D#1984). They live in their own workflow
# rather than as jobs in ci.yml for one reason that is not organisational:
# they need a DIFFERENT TRIGGER.
#
# Each reads something that is not the commit — pr-link-policy and
# pr-mutation-evidence read the PR body, publish-denylist reads the PR's diff
# against its base — and a PR body can be edited after a check has passed,
# with no new commit and no re-run. On ci.yml's trigger set (opened,
# synchronize, reopened by default) a body-reading gate would pass on an
# open, and a violating body pasted in afterwards would never be looked at
# again. That is a hole in exactly the gates whose entire subject is
# trivially mutable, so it is worth closing rather than documenting.
#
# Adding `edited` to ci.yml itself would re-run the whole matrix — three
# workspace legs, the export audit, the backend job's twelve guards, and
# preflight — every time somebody fixes a typo in a description. Splitting
# these out buys the coverage at a fraction of that cost, and leaves ci.yml's
# triggers exactly as they were.
#
# Deliberately the plain `pull_request` event, never the write-token-exposing
# variant of that name, so fork PRs get GitHub's default read-only,
# secret-free token — same reasoning as ci.yml's own header. See D#1537.
#
# None of these three jobs is in CI_REQUIRED_CHECKS
# (scripts/lib/ci-status-check.sh). That array's names are exact-string
# matched by the merge gate and adding to it is a separate decision (D#2348
# PR-h item 4 for the first two, out of scope for pr-mutation-evidence per
# D#1984 §3 item 4 and §9). These report; they do not block a merge today.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  pr-link-policy:
    name: PR link policy
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Same kill switch as every job in ci.yml: repo variable CI_DISABLED
    # stands it down. Change it with scripts/set-ci-kill-switch.sh so the
    # change is audited.
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The body is read from the event payload on disk and written to a
      # file. It is NOT passed through `env:`, which is how this first
      # shipped and was wrong in the most embarrassing possible way: the
      # runner prints a step's env block into the log before the step runs,
      # so a body containing the private slug was published verbatim to a
      # log — permanently, and precisely on the bodies this gate exists to
      # catch. Measured in run 33899845562: the raw body landed at
      # 17:18:23.3167824Z and the script's own careful redaction 36ms later
      # at .3532574Z. The redaction was correct and arrived after the runner
      # had already published the thing.
      #
      # ::add-mask:: from a preceding step would also work, but it fails
      # open — it depends on the mask being registered first and on the
      # literal matching exactly. Reading from $GITHUB_EVENT_PATH means the
      # body never enters an environment the runner echoes at all. Only the
      # file PATH goes in `env:`, which is safe to print.
      - name: PR body link policy
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.txt
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$PR_BODY_FILE"
          bash scripts/ci/pr-link-policy.sh

  publish-denylist:
    name: publish denylist
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 5
    steps:
      # fetch-depth: 0, not the default 1. This gate diffs the PR head
      # against the base commit with three-dot syntax, which needs a real
      # merge base in the object store; a shallow fetch leaves the base ref
      # either absent or historyless. The script hard-fails rather than
      # skipping when the base does not resolve, so getting this wrong is a
      # red check-run and not a silent pass — but the point is to get it
      # right.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish denylist (added paths)
        env:
          PUBLISH_DENYLIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/publish-denylist.sh

  pr-mutation-evidence:
    name: PR mutation evidence
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: vars.CI_DISABLED != 'true'
    timeout-minutes: 10
    steps:
      # fetch-depth: 0, same as publish-denylist above: this gate applies and
      # reverts a real patch against the checkout, and a shallow clone is not
      # a tree this job should be trusting for that.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # D#2537: this job is required (scripts/lib/ci-status-check.sh) and its
      # script can declare a real `pytest ...` command, but `ubuntu-latest`
      # does not ship this repo's test dependencies — pytest is declared in
      # requirements.txt, not ambient. Without this step every honest,
      # machine-checkable mutation claim failed with a tooling error, while a
      # prose-only body passed: the gate punished rigour. Same Setup
      # Python + install convention as the `backend (import-smoke)` job in
      # ci.yml (D#2537 standing rule 2 / Spec Implementation Notes: match the
      # existing recipe rather than invent a second one).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Same body-to-file discipline as PR link policy above, and for the
      # identical reason: the runner prints a step's env block into the log
      # before the step runs, so the body must never pass through `env:`.
      - name: PR mutation evidence
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.txt
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$PR_BODY_FILE"
          bash scripts/ci/pr-mutation-evidence.sh
